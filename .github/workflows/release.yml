name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "release/YaoZhuGuide-${{ github.ref_name }}.zip" \
            --repo "${{ github.repository }}" \
            --title "小夭竺宝典 ${{ github.ref_name }}" \
            --notes "内嵌 Quick Access 图标，默认打开 https://v2.gw2.org.cn/bilibili-topic。安装包只需解压 YaoZhuGuide.dll；已有同名 INI 配置仍可覆盖默认地址。"
