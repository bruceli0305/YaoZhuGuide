name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "release/YaoZhuGuide-${{ github.ref_name }}.zip" \
            --repo "${{ github.repository }}" \
            --title "小夭竺宝典 ${{ github.ref_name }}" \
            --notes "首个可手动安装版本。包含 YaoZhuGuide.dll、YaoZhuGuide.ini 和 YaoZhuGuideIcon.png。"
